# Local full-feature overlay for Platform-Collective/platform.
# Run together with dev/docker-compose.yaml and dev/docker-compose.ext.yaml.
# Intended for Docker Desktop / WSL2 testing only; not a production configuration.

services:
  livekit:
    image: ${LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.12.0}
    command:
      - --config
      - /etc/livekit/livekit.yaml
      - --node-ip
      - ${LIVEKIT_NODE_IP:?Run scripts/local-full/prepare-env.sh first}
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.local.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

  livekit-egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.12.0}
    cap_add:
      - SYS_ADMIN
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - EGRESS_CONFIG_FILE=/etc/livekit/egress.yaml
    volumes:
      - ./egress.local.yaml:/etc/livekit/egress.yaml:ro
    restart: unless-stopped

  love:
    image: hardcoreeng/love
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      datalake:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - "8097:8097"
    environment:
      - PORT=8097
      - SERVICE_ID=love-service
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - REGION=cockroach
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=datalake|http://datalake:4030
      - S3_STORAGE_CONFIG=s3|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin&region=local
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_PROJECT=dev
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_WEBHOOK_API_KEY=whkey
      - LIVEKIT_WEBHOOK_API_SECRET=whsecret
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - ENABLE_CONSOLE=true
    restart: unless-stopped

  notification:
    image: hardcoreeng/notification
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - SOURCE=no-reply@huly.local
      - AUTH_TOKEN=secret
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - PUSH_PRIVATE_KEY=${PUSH_PRIVATE_KEY}
      - PUSH_SUBJECT=${PUSH_SUBJECT:-mailto:test@huly.local}
    restart: unless-stopped

  transactor_cockroach:
    depends_on:
      notification:
        condition: service_started
    environment:
      - WEB_PUSH_URL=http://notification:8091
      - MAIL_AUTH_TOKEN=secret

  front:
    environment:
      - LOVE_ENDPOINT=http://huly.local:8097
      - LIVEKIT_WS=ws://huly.local:7880
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
